<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물류·해외영업 뉴스</title>
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#14212b;--sub:#5b6b77;--line:#d3dae0;--accent:#b8391f;--navy:#12354f}
@media (prefers-color-scheme:dark){:root{--bg:#0e161d;--card:#16222c;--ink:#e8eef2;--sub:#93a5b2;--line:#2a3a47;--accent:#f0714f;--navy:#8cc0e6}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{margin:0;font-size:24px;font-weight:900}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.lab{color:var(--sub);font-size:13px}
select,button{font:inherit;color:var(--ink)}
select{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--navy);color:var(--bg);border-color:var(--navy);font-weight:700}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.item.s{border-left-color:var(--navy)}
.item a{color:var(--ink);font-weight:700;text-decoration:none}.item a:hover{text-decoration:underline}
.item .src a{font-weight:400;color:var(--navy);text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.tag{border:1px solid var(--navy);color:var(--navy);background:transparent;border-radius:4px;padding:0 8px;font-size:13px;margin-right:4px;cursor:pointer}
.save{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:2px 12px;cursor:pointer}
.save[aria-pressed=true]{background:var(--accent);color:var(--card);font-weight:700}
.chip{display:inline-block;background:var(--navy);color:var(--bg);border-radius:999px;padding:2px 12px;margin-bottom:10px;cursor:pointer}
h2{font-size:16px;margin:18px 0 8px;color:var(--sub)}
ul.f{margin:6px 0;padding-left:18px}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:560px){.wrap{padding:14px 12px 40px}h1{font-size:21px}.top{flex-direction:column;align-items:stretch}.top label{display:block}.top select{width:100%;font-size:16px;min-height:40px}.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.tabs button{white-space:nowrap;min-height:40px}.save,.tag{min-height:30px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>물류·해외영업 뉴스</h1><div class="lab" id="upd"></div></div>
<label class="lab">날짜 <select id="dsel"></select></label></div>
<div class="tabs" id="tabs">
<button data-c="brief" aria-selected="true">브리핑</button><button data-c="all" aria-selected="false">뉴스 전체</button>
<button data-c="sales" aria-selected="false">해외영업</button><button data-c="log" aria-selected="false">물류·해운</button>
<button data-c="saved" aria-selected="false" id="stab">저장함</button></div>
<div id="chip"></div><div id="list"></div>
<p class="lab">뉴스는 제목과 출처 링크만 자동 수집합니다. 브리핑은 자동 생성된 내용이므로 수치와 사실은 원문에서 확인하세요.</p>
</div>
<script>
var $=function(i){return document.getElementById(i)},items=[],brief=[],briefErr='',bi=0,cat='brief',day='recent',tag=null,saved={};
function arr(v){return Array.isArray(v)?v:[]}
function normItem(o){o=o||{};return {id:o.id||o.link||String(Math.random()),date:o.date||'',title:o.title||'(제목 없음)',link:o.link||'#',source:o.source||'',cats:arr(o.cats),tags:arr(o.tags)}}
function normDay(d){d=d||{};return {date:d.date||'',mode:d.mode||'',issues:arr(d.issues).map(function(i){i=i||{};return {cat:i.cat,title:i.title||'',what:i.what||'',why:i.why||'',impact:i.impact||'',tags:arr(i.tags),sources:arr(i.sources)}}),interview:arr(d.interview).map(function(v){v=v||{};return {topic:v.topic||'',script:arr(v.script),followups:arr(v.followups)}}),concept:d.concept&&typeof d.concept==='object'?d.concept:{}}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
try{saved=JSON.parse(localStorage.getItem('saved')||'{}')}catch(e){}
Object.keys(saved).forEach(function(k){saved[k]=normItem(saved[k])});
function persist(){try{localStorage.setItem('saved',JSON.stringify(saved))}catch(e){}}
function lk(a){return a.map(function(x){return '<a href="'+esc(x&&x.url)+'" target="_blank" rel="noopener">'+esc(x&&x.name)+'</a>'}).join(', ')}
function card(o){return '<div class="item'+(o.cats.indexOf('sales')>-1?'':' s')+'"><a href="'+esc(o.link)+'" target="_blank" rel="noopener">'+esc(o.title)+'</a><div class="row"><span class="lab">'+esc(o.source)+' · '+esc(o.date)+'</span><span>'+o.tags.map(function(t){return '<button class="tag" data-tag="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'<button class="save" data-id="'+esc(o.id)+'" aria-pressed="'+(!!saved[o.id])+'">'+(saved[o.id]?'★ 저장됨':'☆ 저장')+'</button></span></div></div>'}
function briefHTML(){
if(!brief.length)return '<div class="item">'+(briefErr?esc(briefErr):'아직 브리핑이 없습니다. 자동 실행이 끝나면 생성됩니다.')+'</div>';
var b=brief[bi]||brief[0];
var h='<h2>'+esc(b.date)+' 브리핑</h2><div class="lab" style="margin-bottom:10px">'+(b.mode==='ai'?'AI 자동 생성(기사 제목 기반) · 수치와 사실은 원문에서 꼭 확인하세요':'규칙 기반 자동 생성 · 일반적인 해석이며 기사별 분석은 아닙니다')+'</div>';
b.issues.forEach(function(i){h+='<div class="item'+(i.cat==='sales'?'':' s')+'"><b>'+esc(i.title)+'</b><ul class="f"><li><b>무슨 일</b> '+esc(i.what)+'</li><li><b>왜</b> '+esc(i.why)+'</li><li><b>영향</b> '+esc(i.impact)+'</li></ul><div class="row"><span>'+i.tags.map(function(t){return '<button class="tag" data-tag="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</span><span class="lab src">출처: '+lk(i.sources)+'</span></div></div>'});
if(b.interview.length)h+='<h2>면접 답변 (60초)</h2>';
b.interview.forEach(function(v){h+='<div class="item"><b>주제: '+esc(v.topic)+'</b><div style="margin:6px 0">'+v.script.map(function(t,k){return '<p style="margin:4px 0"><b>'+['① 요약','② 원인','③ 직무 연결','④ 내 생각'][k]+'</b> '+esc(t)+'</p>'}).join('')+'</div>'+(v.followups.length?'<div class="lab">예상 꼬리질문</div><ul class="f">'+v.followups.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ul>':'')+'</div>'});
if(b.concept&&b.concept.title)h+='<h2>오늘의 필수 개념</h2><div class="item"><b>'+esc(b.concept.title)+'</b><p style="margin:6px 0">'+esc(b.concept.body)+'</p><div class="lab">'+esc(b.concept.tip||'')+'</div></div>';
return h}
function render(){
var dates=[];items.forEach(function(o){if(dates.indexOf(o.date)<0)dates.push(o.date)});
var opts=cat==='brief'?brief.map(function(d,i){return '<option value="'+i+'"'+(i===bi?' selected':'')+'>'+esc(d.date)+'</option>'}).join(''):'<option value="recent"'+(day==='recent'?' selected':'')+'>최근 3일</option><option value="all"'+(day==='all'?' selected':'')+'>전체 기간</option>'+dates.map(function(d){return '<option value="'+esc(d)+'"'+(day===d?' selected':'')+'>'+esc(d)+'</option>'}).join('');
$('dsel').innerHTML=opts||'<option>-</option>';$('dsel').disabled=(cat==='saved');
$('stab').textContent='저장함 ('+Object.keys(saved).length+')';
[].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.setAttribute('aria-selected',b.dataset.c===cat)});
$('chip').innerHTML=(tag&&cat!=='brief')?'<span class="chip" data-clear="1">태그: '+esc(tag)+' ✕</span>':'';
if(cat==='brief'){var bh;try{bh=briefHTML()}catch(e){bh='<div class="item">브리핑 표시 오류: '+esc(e.message)+'</div>'}$('list').innerHTML=bh;return}
var list;
if(cat==='saved')list=Object.keys(saved).map(function(k){return saved[k]});
else{list=items.filter(function(o){return cat==='all'||o.cats.indexOf(cat)>-1});
if(tag)list=list.filter(function(o){return o.tags.indexOf(tag)>-1});
else if(day==='recent')list=list.filter(function(o){return dates.slice(0,3).indexOf(o.date)>-1});
else if(day!=='all')list=list.filter(function(o){return o.date===day})}
if(!list.length){$('list').innerHTML='<div class="item">'+(items.length?'표시할 뉴스가 없습니다.':'아직 수집된 뉴스가 없습니다. GitHub의 Actions 탭에서 Daily news를 한 번 실행해 주세요.')+'</div>';return}
var h='',last='';list.forEach(function(o){if(cat!=='saved'&&o.date!==last){last=o.date;h+='<h2>'+esc(o.date)+'</h2>'}h+=card(o)});$('list').innerHTML=h}
document.addEventListener('click',function(e){var t=e.target;
if(t.dataset.c){cat=t.dataset.c}
else if(t.dataset.tag){tag=t.dataset.tag;cat='all'}
else if(t.dataset.clear){tag=null}
else if(t.dataset.id){var id=t.dataset.id;if(saved[id])delete saved[id];else{items.forEach(function(o){if(o.id===id)saved[id]=o})};persist()}
else return;render()});
$('dsel').addEventListener('change',function(){if(cat==='brief'){bi=+this.value}else{day=this.value;tag=null}render()});
function showErr(m){$('list').innerHTML='<div class="item">'+esc(m)+'</div>'}
fetch('data/news.json?'+Date.now()).then(function(r){if(!r.ok)throw new Error('news.json 불러오기 실패 (HTTP '+r.status+'). 사이트 주소 뒤에 /data/news.json 을 붙여 열어 보세요.');return r.json()})
.then(function(d){items=arr(d.items).map(normItem);$('upd').textContent=d.updated?'뉴스 업데이트: '+d.updated:'';try{render()}catch(e){showErr('화면 표시 오류: '+e.message)}})
.catch(function(e){if(cat!=='brief')showErr(e instanceof SyntaxError?'news.json 형식 오류: '+e.message:(e.message==='Failed to fetch'?'데이터를 불러오지 못했습니다. 파일을 그냥 열지 말고 GitHub Pages 주소로 여세요.':e.message))});
fetch('data/briefing.json?'+Date.now()).then(function(r){if(!r.ok)throw new Error('briefing.json 불러오기 실패 (HTTP '+r.status+'). 사이트 주소 뒤에 /data/briefing.json 을 붙여 열어 보세요.');return r.json()})
.then(function(d){brief=arr(d.days).map(normDay);render()})
.catch(function(e){briefErr=e instanceof SyntaxError?'briefing.json 형식 오류: '+e.message:'브리핑 처리 오류: '+e.message;try{render()}catch(x){}});
render();
</script>
</body>
</html>
