<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물류·해외영업 뉴스</title>
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#14212b;--sub:#5b6b77;--line:#d3dae0;--accent:#b8391f;--navy:#12354f}
@media (prefers-color-scheme:dark){:root{--bg:#0e161d;--card:#16222c;--ink:#e8eef2;--sub:#93a5b2;--line:#2a3a47;--accent:#f0714f;--navy:#8cc0e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{margin:0;font-size:24px;font-weight:900}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.lab{color:var(--sub);font-size:13px}
select,button{font:inherit;color:var(--ink)}
select{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--navy);color:var(--bg);border-color:var(--navy);font-weight:700}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.item.s{border-left-color:var(--navy)}
.item a{color:var(--ink);font-weight:700;text-decoration:none}.item a:hover{text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.tag{border:1px solid var(--navy);color:var(--navy);background:transparent;border-radius:4px;padding:0 8px;font-size:13px;margin-right:4px;cursor:pointer}
.save{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:2px 12px;cursor:pointer}
.save[aria-pressed=true]{background:var(--accent);color:var(--card);font-weight:700}
.chip{display:inline-block;background:var(--navy);color:var(--bg);border-radius:999px;padding:2px 12px;margin-bottom:10px;cursor:pointer}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));margin-bottom:12px}.g .item{border-left-width:1px;margin:0}.big{font-size:24px;font-weight:900;line-height:1.3}.b{margin:6px 0;padding:0;list-style:none}.b b{color:var(--accent);display:inline-block;min-width:56px}.item .srcs a,.b a{font-weight:400;color:var(--navy);text-decoration:underline}.pill{display:inline-block;border:1px solid var(--navy);color:var(--navy);border-radius:4px;padding:0 8px;font-size:13px;margin:2px 4px 2px 0}details{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:10px}summary{cursor:pointer;font-weight:700}
@media(max-width:560px){.wrap{padding:14px 12px 40px}.top{flex-direction:column;align-items:stretch}.top label{display:block}.top select{width:100%;font-size:16px;min-height:40px}.tabs{flex-wrap:nowrap;overflow-x:auto}.tabs button{white-space:nowrap;min-height:40px}.b b{display:block;min-width:0}}
h2{font-size:16px;margin:18px 0 8px;color:var(--sub)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>물류·해외영업 뉴스</h1><div class="lab" id="upd"></div></div>
<label class="lab">날짜 <select id="dsel"></select></label></div>
<div class="tabs" id="tabs">
<button data-c="brief" aria-selected="true">브리핑</button><button data-c="all" aria-selected="false">뉴스 전체</button><button data-c="sales" aria-selected="false">해외영업</button>
<button data-c="log" aria-selected="false">물류·해운</button><button data-c="brief" aria-selected="false">브리핑</button><button data-c="saved" aria-selected="false" id="stab">저장함</button></div>
<div id="chip"></div><div id="list"></div>
<p class="lab">제목과 출처 링크만 자동 수집합니다. 자세한 내용은 원문에서 확인하세요.</p>
</div>
<script>
var $=function(i){return document.getElementById(i)},items=[],brief=[],bi=0,cat='brief',day='recent',tag=null,saved={};
try{saved=JSON.parse(localStorage.getItem('saved')||'{}')}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function persist(){try{localStorage.setItem('saved',JSON.stringify(saved))}catch(e){}}
function card(o){return '<div class="item'+(o.cats.indexOf('sales')>-1?'':' s')+'"><a href="'+esc(o.link)+'" target="_blank" rel="noopener">'+esc(o.title)+'</a><div class="row"><span class="lab">'+esc(o.source)+' · '+o.date+'</span><span>'+o.tags.map(function(t){return '<button class="tag" data-tag="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'<button class="save" data-id="'+o.id+'" aria-pressed="'+(!!saved[o.id])+'">'+(saved[o.id]?'★ 저장됨':'☆ 저장')+'</button></span></div></div>'}
function bcard(o){var r=o.r||{};return '<div class="item'+(o.c==='sales'?'':' s')+'"><b>'+esc(o.t)+'</b><ul class="b"><li><b>무슨 일</b>'+esc(o.w)+'</li><li><b>왜</b>'+esc(o.y)+'</li><li><b>영향</b>'+esc(o.i)+'</li></ul><div>'+(r.ind||[]).map(function(x){return '<span class="pill">'+esc(x)+'</span>'}).join('')+(r.co||[]).map(function(x){return '<span class="pill" style="background:var(--navy);color:var(--bg)">'+esc(x)+'</span>'}).join('')+(r.org||[]).map(function(x){return '<span class="pill" style="border-color:var(--line);color:var(--sub)">'+esc(x)+'</span>'}).join('')+'</div><div class="row srcs"><span class="lab">출처: '+(o.s||[]).map(function(x){return '<a href="'+esc(x[1])+'" target="_blank" rel="noopener">'+esc(x[0])+'</a>'}).join(', ')+'</span></div></div>'}
function ivBox(v){return '<details><summary>면접 답변: '+esc(v.topic)+'</summary>'+v.script.map(function(t,i){return '<p><b>'+['① 요약','② 원인','③ 직무 연결','④ 내 생각'][i]+'</b> '+esc(t)+'</p>'}).join('')+'<ul>'+v.q.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ul></details>'}
function renderBrief(){
$('dsel').innerHTML=brief.map(function(d,i){return '<option value="'+i+'"'+(i===bi?' selected':'')+'>'+esc(d.label)+'</option>'}).join('');
$('chip').innerHTML='';var d=brief[bi];
if(!d){$('list').innerHTML='<div class="item">아직 브리핑이 없습니다. 예약 작업이 처음 실행되면 이곳에 표시됩니다.</div>';return}
var h='<div class="g">'+d.ind.map(function(x){return '<div class="item"><div class="lab">'+esc(x[0])+'</div><div class="big">'+esc(x[1])+'</div><div class="lab">'+esc(x[2])+'</div></div>'}).join('')+'</div>';
[['sales','해외영업 이슈'],['log','물류·해운 이슈']].forEach(function(g){var l=d.issues.filter(function(o){return (o.c||'log')===g[0]});h+='<h2>'+g[1]+'</h2>'+(l.length?l.map(bcard).join(''):'<div class="item lab">이 날짜에는 수집된 이슈가 없습니다.</div>')});
h+='<h2>면접 답변</h2>'+[d.iv2,d.iv].filter(Boolean).map(ivBox).join('');
if(d.cn)h+='<h2>오늘의 필수 개념</h2><details open><summary>'+esc(d.cn.t)+'</summary><p>'+esc(d.cn.b)+'</p><p class="lab">'+esc(d.cn.tip)+'</p></details>';
$('list').innerHTML=h}
function render(){
[].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.setAttribute('aria-selected',b.dataset.c===cat)});
$('stab').textContent='저장함 ('+Object.keys(saved).length+')';
if(cat==='brief'){renderBrief();return}
var dates=[];items.forEach(function(o){if(dates.indexOf(o.date)<0)dates.push(o.date)});
$('dsel').innerHTML='<option value="recent">최근 3일</option><option value="all"'+(day==='all'?' selected':'')+'>전체 기간</option>'+dates.map(function(d){return '<option value="'+d+'"'+(day===d?' selected':'')+'>'+d+'</option>'}).join('');
if(day==='recent')$('dsel').value='recent';
$('stab').textContent='저장함 ('+Object.keys(saved).length+')';
[].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.setAttribute('aria-selected',b.dataset.c===cat)});
$('chip').innerHTML=tag?'<span class="chip" data-clear="1">태그: '+esc(tag)+' ✕</span>':'';
var list;if(cat==='brief'){$('list').innerHTML=briefHTML();return}
if(cat==='saved')list=Object.keys(saved).map(function(k){return saved[k]});
else{list=items.filter(function(o){return cat==='all'||o.cats.indexOf(cat)>-1});
if(tag)list=list.filter(function(o){return o.tags.indexOf(tag)>-1});
else if(day==='recent')list=list.filter(function(o){return dates.slice(0,3).indexOf(o.date)>-1});
else if(day!=='all')list=list.filter(function(o){return o.date===day})}
if(!list.length){$('list').innerHTML='<div class="item">'+(items.length?'표시할 뉴스가 없습니다.':'아직 수집된 뉴스가 없습니다. GitHub의 Actions 탭에서 Daily news를 한 번 실행해 주세요.')+'</div>';return}
var h='',last='';list.forEach(function(o){if(cat!=='saved'&&o.date!==last){last=o.date;h+='<h2>'+o.date+'</h2>'}h+=card(o)});$('list').innerHTML=h}
var brief=[];
function lk(a){return a.map(function(x){return '<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.name)+'</a>'}).join(', ')}
function briefHTML(){if(!brief.length)return '<div class="item">아직 브리핑이 없습니다. 자동 실행이 끝나면 생성됩니다.</div>';
var b=brief.filter(function(x){return x.date===day})[0]||brief[0];
var h='<h2>'+b.date+' 브리핑</h2><div class="lab" style="margin-bottom:10px">'+(b.mode==='ai'?'AI 자동 생성(기사 제목 기반) · 수치와 사실은 원문에서 꼭 확인하세요':'규칙 기반 자동 생성 · 일반적인 해석이며 기사별 분석은 아닙니다')+'</div>';
b.issues.forEach(function(i){h+='<div class="item'+(i.cat==='sales'?'':' s')+'"><b>'+esc(i.title)+'</b><ul style="margin:6px 0;padding-left:18px"><li><b>무슨 일</b> '+esc(i.what)+'</li><li><b>왜</b> '+esc(i.why)+'</li><li><b>영향</b> '+esc(i.impact)+'</li></ul><div class="row"><span>'+(i.tags||[]).map(function(t){return '<button class="tag" data-tag="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</span><span class="lab">출처: '+lk(i.sources||[])+'</span></div></div>'});
h+='<h2>면접 답변 (60초)</h2>';
(b.interview||[]).forEach(function(v){h+='<div class="item"><b>주제: '+esc(v.topic)+'</b><div style="margin:6px 0">'+v.script.map(function(t,k){return '<p style="margin:4px 0"><b>'+['① 요약','② 원인','③ 직무 연결','④ 내 생각'][k]+'</b> '+esc(t)+'</p>'}).join('')+'</div>'+((v.followups||[]).length?'<div class="lab">예상 꼬리질문</div><ul style="margin:4px 0;padding-left:18px">'+v.followups.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ul>':'')+'</div>'});
if(b.concept&&b.concept.title)h+='<h2>오늘의 필수 개념</h2><div class="item"><b>'+esc(b.concept.title)+'</b><p style="margin:6px 0">'+esc(b.concept.body)+'</p><div class="lab">'+esc(b.concept.tip||'')+'</div></div>';
return h}
document.addEventListener('click',function(e){var t=e.target;
if(t.dataset.c){cat=t.dataset.c}
else if(t.dataset.tag){tag=t.dataset.tag;if(cat==='saved'||cat==='brief')cat='all'}
else if(t.dataset.clear){tag=null}
else if(t.dataset.id){var id=t.dataset.id;if(saved[id])delete saved[id];else{items.concat(Object.keys(saved).map(function(k){return saved[k]})).forEach(function(o){if(o.id===id)saved[id]=o})};persist()}
else return;render()});
$('dsel').addEventListener('change',function(){if(cat==='brief'){bi=+this.value}else{day=this.value;tag=null}render()});
fetch('data/news.json?'+Date.now()).then(function(r){return r.json()}).then(function(d){items=d.items||[];$('upd').textContent=d.updated?'마지막 업데이트: '+d.updated:'';render()}).catch(function(){$('list').innerHTML='<div class="item">데이터를 불러오지 못했습니다. 파일을 그냥 열지 말고 GitHub Pages 주소나 로컬 서버(python -m http.server)로 여세요.</div>'});
fetch('data/briefing.json?'+Date.now()).then(function(r){return r.json()}).then(function(d){brief=d.days||[];render()}).catch(function(){render()});
fetch('data/briefing.json?'+Date.now()).then(function(r){return r.json()}).then(function(d){brief=d.days||[];render()}).catch(function(){});
</script>
</body>
</html>
